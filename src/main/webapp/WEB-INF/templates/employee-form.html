<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? 'Edit Employee' : 'Add Employee'">Employee Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="../../css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <a class="nav-brand" th:href="@{/dashboard}">
            <span>🏢 ProjectAlloc</span>
        </a>
        <ul class="nav-links">
            <li><a class="nav-link" th:href="@{/dashboard}">Dashboard</a></li>
            <li><a class="nav-link active" th:href="@{/employees}">Employees</a></li>
            <li><a class="nav-link" th:href="@{/projects}">Projects</a></li>
            <li><a class="nav-link" th:href="@{/allocations}">Allocations</a></li>
            <li><a class="nav-link" th:href="@{/my-projects}">My Projects</a></li>
            <li>
                <div class="user-profile-badge">
                    <span th:text="${currentUserName}">User</span>
                    <span class="badge-role" th:classappend="${currentUserRole}" th:text="${currentUserRole}">ADMIN</span>
                </div>
            </li>
            <li><a class="btn btn-secondary btn-sm" th:href="@{/logout}">Logout</a></li>
        </ul>
    </div>
</nav>

<main class="main-content">
    <div class="card" style="max-width: 680px; margin: 0 auto;">
        <div class="card-header">
            <h2 class="card-title" th:text="${isEdit} ? 'Edit Employee' : 'Add New Employee'">Employee Form</h2>
            <a th:href="@{/employees}" class="btn btn-secondary btn-sm">&larr; Back to List</a>
        </div>

        <div th:if="${errorMessage != null}" class="alert alert-danger" th:utext="${errorMessage}"></div>

        <form th:action="@{/employees/save}" th:object="${employee}" method="post">

            <input type="hidden" name="employeeID" th:value="*{employeeID}" />

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="employeeName">Full Name *</label>
                    <input type="text"
                           th:field="*{employeeName}"
                           class="form-control"
                           placeholder="Full Name"
                           required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email Address *</label>
                    <input type="email"
                           th:field="*{email}"
                           class="form-control"
                           placeholder="user@college.edu"
                           required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="designation">Designation *</label>
                    <input type="text"
                           th:field="*{designation}"
                           class="form-control"
                           placeholder="e.g. Software Engineer"
                           required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="salary">Annual Salary *</label>
                    <input type="number"
                           th:field="*{salary}"
                           step="0.01"
                           min="1"
                           class="form-control"
                           placeholder="e.g. 75000"
                           required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="role">Role *</label>
                    <select th:field="*{role}" class="form-control" required>
                        <option value="EMPLOYEE" th:selected="*{role == 'EMPLOYEE'}">Employee (Standard Access)</option>
                        <option value="ADMIN"    th:selected="*{role == 'ADMIN'}">Admin (Full Management)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">
                        Password
                        <span th:if="${!isEdit}">*</span>
                        <span th:if="${isEdit}" style="font-size:0.8rem;font-weight:normal;color:var(--text-muted);">
                            (leave blank to keep current password)
                        </span>
                    </label>
                    <input type="password"
                           id="password"
                           name="password"
                           class="form-control"
                           placeholder="Minimum 6 characters"
                           th:required="${!isEdit}">
                </div>
            </div>

            <div style="display:flex;gap:1rem;justify-content:flex-end;margin-top:1.5rem;">
                <a th:href="@{/employees}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary"
                        th:text="${isEdit} ? 'Update Employee' : 'Save Employee'">
                    Save
                </button>
            </div>
        </form>
    </div>
</main>

<footer class="footer">&copy; 2026 Employee Project Allocation System</footer>
</body>
</html>
