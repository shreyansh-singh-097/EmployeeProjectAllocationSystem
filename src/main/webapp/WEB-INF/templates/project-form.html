<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Edit Project' : 'Add Project'} + ' - ProjectAlloc'">Project Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="../../css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <a class="nav-brand" th:href="@{/dashboard}">
            <span>🏢 ProjectAlloc</span>
        </a>
        <ul class="nav-links">
            <li><a class="nav-link" th:href="@{/dashboard}">Dashboard</a></li>
            <li><a class="nav-link" th:href="@{/employees}">Employees</a></li>
            <li><a class="nav-link active" th:href="@{/projects}">Projects</a></li>
            <li><a class="nav-link" th:href="@{/allocations}">Allocations</a></li>
            <li><a class="nav-link" th:href="@{/my-projects}">My Projects</a></li>
            <li>
                <div class="user-profile-badge">
                    <span th:text="${currentUserName}">User</span>
                    <span class="badge-role" th:classappend="${currentUserRole}" th:text="${currentUserRole}">ADMIN</span>
                </div>
            </li>
            <li><a class="btn btn-secondary btn-sm" th:href="@{/logout}">Logout</a></li>
        </ul>
    </div>
</nav>

<main class="main-content">
    <div class="card" style="max-width: 700px; margin: 0 auto;">
        <div class="card-header">
            <h2 class="card-title" th:text="${isEdit ? 'Edit Project Details' : 'Create New Project'}">
                Project Form
            </h2>
            <a th:href="@{/projects}" class="btn btn-secondary btn-sm">&larr; Back to List</a>
        </div>

        <div th:if="${errorMessage != null}" class="alert alert-danger" th:utext="${errorMessage}"></div>

        <form th:action="@{/projects/save}" th:object="${project}" method="post">
            <input type="hidden" name="projectID" th:value="*{projectID}" />

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="projectName">Project Name *</label>
                    <input type="text"
                           th:field="*{projectName}"
                           class="form-control"
                           placeholder="e.g. Campus ERP System" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="clientName">Client Name *</label>
                    <input type="text"
                           th:field="*{clientName}"
                           class="form-control"
                           placeholder="e.g. Apex University" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="startDate">Start Date *</label>
                    <input type="date"
                           th:field="*{startDate}"
                           class="form-control" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="budget">Total Budget *</label>
                    <input type="number"
                           th:field="*{budget}"
                           step="0.01" min="1" class="form-control"
                           placeholder="e.g. 50000" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="maximumTeamSize">Maximum Team Size *</label>
                    <input type="number"
                           th:field="*{maximumTeamSize}"
                           min="1" class="form-control"
                           placeholder="e.g. 5" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="status">Project Status *</label>
                    <select th:field="*{status}" class="form-control" required>
                        <option value="Planned" th:selected="*{status == 'Planned'}">Planned</option>
                        <option value="Active" th:selected="*{status == 'Active'}">Active</option>
                        <option value="Completed" th:selected="*{status == 'Completed'}">Completed</option>
                    </select>
                </div>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1.5rem; justify-content: flex-end;">
                <a th:href="@{/projects}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary"
                        th:text="${isEdit ? 'Update Project' : 'Create Project'}">
                    Save Project
                </button>
            </div>
        </form>
    </div>
</main>

<footer class="footer">
    &copy; 2026 Employee Project Allocation System
</footer>

</body>
</html>
